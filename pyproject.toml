[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-nutritionist"
version = "0.1.0"
description = "A recipe rating predictor and nutrition facts assistant built on Epicurious recipe data."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "aiohttp>=3.9,<4",
    "beautifulsoup4==4.13.4",
    "catboost==1.2.10",
    "ipykernel==6.29.5",
    "ipython==9.3.0",
    "ipywidgets==8.1.7",
    "joblib==1.5.1",
    "matplotlib-inline==0.1.7",
    "numpy==2.3.1",
    "pandas==2.3.0",
    "requests==2.32.4",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
    "tqdm==4.67.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["nutritionist", "recipes"]
