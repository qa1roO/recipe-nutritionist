[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-nutritionist"
version = "0.2.0"
description = "A recipe rating predictor and nutrition facts assistant built on Epicurious recipe data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "catboost==1.2.10",
    "joblib==1.5.1",
    "numpy==2.3.1",
    "pandas==2.3.0",
    "requests==2.32.4",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "mlflow-skinny>=3.17,<4",
    "skops>=0.11,<1",
]
train = [
    "mlflow>=3.17,<4",
]
test = [
    "pytest>=8",
    "httpx>=0.27,<1",
]
research = [
    "aiohttp>=3.9,<4",
    "beautifulsoup4==4.13.4",
    "ipykernel==6.29.5",
    "ipython==9.3.0",
    "ipywidgets==8.1.7",
    "matplotlib-inline==0.1.7",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["api", "config", "nutritionist", "recipes", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
